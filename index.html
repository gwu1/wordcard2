<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vocabulary Flashcards</title>
    <link rel="stylesheet" href="styles.css?v=20240329-1634">
    <!-- GitHub Pages deployment fix -->
</head>
<body>
    <!-- Menu Mode -->
    <div id="menuMode" class="mode">
        <div class="container">
            <header>
                <h1>📚 Vocabulary Flashcards</h1>
                <p>Add words and definitions to create flashcards for learning</p>
                
                <div class="set-selector">
                    <label for="setSelect">Word Set:</label>
                    <select id="setSelect">
                        <option value="default">Default Set</option>
                    </select>
                    <button id="newSetBtn" class="btn btn-secondary">+ New Set</button>
                    <button id="deleteSetBtn" class="btn btn-danger">Delete Set</button>
                </div>
                
                <div class="presentation-section">
                    <button id="startPresentation" class="btn btn-large btn-success" disabled>
                        🎯 Start Presentation Mode
                    </button>
                </div>
            </header>
            
            <main>
                <section class="input-section">
                    <h2>Add New Word</h2>
                    <form id="wordForm">
                        <div class="form-group">
                            <label for="word">Word:</label>
                            <input type="text" id="word" required placeholder="Enter the word">
                        </div>
                        <div class="form-group">
                            <label for="definition">Definition:</label>
                            <textarea id="definition" placeholder="Enter the definition or meaning (optional)"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Word</button>
                    </form>
                </section>
                
                <section class="import-section">
                    <h2>Import Multiple Words</h2>
                    <div class="import-controls">
                        <div class="example-checkbox">
                            <label>
                                <input type="checkbox" id="useExample"> Use example word list
                            </label>
                        </div>
                        <div class="form-group">
                            <label for="bulkWords">Words (one per line):</label>
                            <textarea id="bulkWords" placeholder="lesson&#10;boring&#10;elephant&#10;frightened&#10;truck"></textarea>
                        </div>
                        <button id="importBtn" class="btn btn-secondary">Import Words</button>
                    </div>
                </section>
                
                <section class="words-section">
                    <div class="section-header">
                        <h2>Word List</h2>
                        <div class="stats">
                            <span id="wordCount">0 words</span>
                            <button id="clearAll" class="btn btn-danger">Clear All</button>
                        </div>
                    </div>
                    <div id="wordsList" class="words-list">
                        <!-- Words will be displayed here -->
                    </div>
                </section>
            </main>
        </div>
    </div>
    
    <!-- Presentation Mode -->
    <div id="presentationMode" class="mode hidden">
        <div class="flashcard-container">
            <button id="exitBtn" class="exit-btn" title="Exit presentation">✕</button>
            <button id="pronounceBtn" class="pronounce-btn" title="Pronounce word">🔊</button>
            <div class="flashcard" id="flashcard">
                <div class="word-display" id="wordDisplay">
                    <!-- Current word will be displayed here -->
                </div>
            </div>
            
            <div class="exit-hint">Tap/swipe for next word • Top-right ✕ to exit • 🔊 to pronounce</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
